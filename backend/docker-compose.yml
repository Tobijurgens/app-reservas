services:
  postgres-db:
    image: postgres:16
    container_name: base-datos-turnos
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: turnos_db
    ports:
      - "5432:5432"
    volumes:
      - turnos_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-notificaciones:
    image: postgres:16
    container_name: base-datos-notificaciones
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: notificaciones_db
    ports:
      - "5433:5432"
    volumes:
      - notificaciones_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_eventos
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  gateway-app:
    build: ./microservice-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      RESERVAS_URI: http://reservas-app:8081
      NOTIFICACIONES_URI: http://notificaciones-app:8082
    depends_on:
      - reservas-app
      - notificaciones-app
    restart: unless-stopped

  reservas-app:
    build: ./microservice-reservas
    container_name: microservicio-reservas
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/turnos_db
      SPRING_RABBITMQ_HOST: rabbitmq
      APP_OUTBOX_RETRY_INITIAL_MS: ${OUTBOX_RETRY_INITIAL_MS:-60000}
      APP_OUTBOX_RETRY_MAX_MS: ${OUTBOX_RETRY_MAX_MS:-300000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - postgres-db
      - rabbitmq
    restart: unless-stopped

  notificaciones-app:
    build: ./microservice-notificaciones
    container_name: microservicio-notificaciones
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notificaciones:5432/notificaciones_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      APP_NOTIFICACIONES_MAX_INTENTOS: ${SMTP_MAX_INTENTOS:-5}
      APP_NOTIFICACIONES_RETRY_INITIAL_MS: ${SMTP_RETRY_INITIAL_MS:-60000}
      APP_NOTIFICACIONES_RETRY_MAX_MS: ${SMTP_RETRY_MAX_MS:-300000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - postgres-notificaciones
      - rabbitmq
    restart: unless-stopped

volumes:
  turnos_data:
  notificaciones_data:
  rabbitmq_data:
