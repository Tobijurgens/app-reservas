services:
  postgres-db:
    image: postgres:16
    container_name: base-datos-turnos
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: turnos_db
    ports:
      - "5432:5432"
    volumes:
      - turnos_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  turnos_data: