spring.application.name=microservice-gateway
server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=notificaciones-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${NOTIFICACIONES_URI:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/notificaciones/**

spring.cloud.gateway.server.webmvc.routes[1].id=reservas
spring.cloud.gateway.server.webmvc.routes[1].uri=${RESERVAS_URI:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/**