<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
<h2 style="color: #0056b3;" th:text="'¡Hola, ' + ${nombre} + '!'">¡Hola!</h2>
<p>Gracias por registrarte en AgendApp. Ya casi estamos listos.</p>
<p>Por favor, hacé clic en el siguiente botón para verificar tu cuenta y activarla:</p>

<a th:href="${enlace}"
   style="display: inline-block; padding: 10px 20px; margin-top: 15px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px;">
    Activar mi cuenta
</a>

<p style="margin-top: 30px; font-size: 12px; color: #777;">
    Si no solicitaste este registro, podés ignorar este correo.
</p>
</body>
</html>
